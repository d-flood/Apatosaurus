name: App CI

on:
  push:
    paths:
      - "app/**"
      - "collatex"
      - "collatex/collatex-tsport/**"
      - "triiiceratops"
      - "triiiceratops/**"
      - "packages/tei-transcription/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "collatex"
      - "collatex/collatex-tsport/**"
      - "triiiceratops"
      - "triiiceratops/**"
      - "packages/tei-transcription/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/app-ci.yml"

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.DJAZZKIT_ACCESS_TOKEN }}

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build triiiceratops
        run: pnpm install --frozen-lockfile && pnpm run build:all
        working-directory: triiiceratops

      - name: Refresh built viewer dependencies
        run: pnpm install --offline --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: app

      - name: Lint
        run: pnpm run lint
        working-directory: app

      - name: Typecheck
        run: pnpm run check
        working-directory: app

      - name: Unit tests
        run: pnpm run test:unit -- --run
        working-directory: app

      - name: Build
        run: pnpm run build
        working-directory: app

      - name: End-to-end tests
        run: pnpm run test:e2e
        working-directory: app
