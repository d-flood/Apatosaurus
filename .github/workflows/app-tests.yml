name: App Tests

on:
  push:
    paths:
      - "app/**"
      - "collatex"
      - "collatex/collatex-tsport/**"
      - "triiiceratops"
      - "triiiceratops/**"
      - "packages/tei-transcription/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/app-tests.yml"
  pull_request:
    paths:
      - "app/**"
      - "collatex"
      - "collatex/collatex-tsport/**"
      - "triiiceratops"
      - "triiiceratops/**"
      - "packages/tei-transcription/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/app-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.DJAZZKIT_ACCESS_TOKEN || github.token }}

      # Required by test-support/validate-igntp-xsd.ts, which shells out to `uv run`.
      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build triiiceratops library prerequisites
        run: pnpm install --frozen-lockfile && pnpm run build:all
        working-directory: triiiceratops

      - name: Refresh built viewer dependencies
        run: pnpm install --offline --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: app

      - name: Check generated database types
        run: pnpm run db:generate && pnpm run db:check
        working-directory: app

      - name: Check app types
        run: pnpm run check
        working-directory: app

      - name: Run unit and browser-mode tests
        run: pnpm run test:unit -- --run
        working-directory: app

      - name: Run Playwright scenarios
        run: pnpm exec playwright test
        working-directory: app
