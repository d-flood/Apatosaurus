name: App Tests

on:
  push:
    paths:
      - 'app/**'
      - 'collatex'
      - 'collatex/collatex-tsport/**'
      - 'triiiceratops'
      - 'triiiceratops/**'
      - 'packages/tei-transcription/**'
      - '.github/workflows/app-tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'collatex'
      - 'collatex/collatex-tsport/**'
      - 'triiiceratops'
      - 'triiiceratops/**'
      - 'packages/tei-transcription/**'
      - '.github/workflows/app-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.DJAZZKIT_ACCESS_TOKEN || github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build triiiceratops library prerequisites
        run: pnpm run build:lib
        working-directory: triiiceratops

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: app

      - name: Check generated database types
        run: bun run db:generate && bun run db:check
        working-directory: app

      - name: Check app types
        run: bun run check
        working-directory: app

      - name: Run unit and browser-mode tests
        run: bun run test:unit -- --run
        working-directory: app

      - name: Run Playwright scenarios
        run: bunx playwright test
        working-directory: app
