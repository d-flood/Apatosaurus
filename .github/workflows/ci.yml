name: CI

on:
  push:
    paths:
      - "app/**"
      - "collatex"
      - "collatex/collatex-tsport/**"
      - "packages/tei-transcription/**"
      - "packages/auth-worker/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "collatex"
      - "collatex/collatex-tsport/**"
      - "packages/tei-transcription/**"
      - "packages/auth-worker/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.DJAZZKIT_ACCESS_TOKEN || github.token }}

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: app

      - name: Lint
        run: pnpm run lint
        working-directory: app

      - name: Check generated database types
        run: pnpm run db:check
        working-directory: app

      - name: Check app types
        run: pnpm run check
        working-directory: app

      - name: Run unit and browser-mode tests
        run: pnpm run test:unit -- --run
        working-directory: app

      - name: Run Playwright scenarios
        run: pnpm run test:e2e
        working-directory: app

  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.DJAZZKIT_ACCESS_TOKEN || github.token }}

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TEI tests
        run: pnpm --filter @apatosaurus/tei-transcription test

      - name: TEI types
        run: pnpm --filter @apatosaurus/tei-transcription typecheck

      - name: Auth tests
        run: pnpm --filter auth-worker test

      - name: Auth types
        run: pnpm --filter auth-worker typecheck

      - name: CollateX tests
        run: pnpm --filter collatex-tsport test
